<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Práctica P2: calculadora con condicionales y operador ternario">
  <title>UNE4D13 | Práctica P2: calculadora con condicionales y operador ternario</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <div class="container">
      <p class="class-code">Nivel 4 · Clase 13 · UNE4D13</p>
      <h1>Práctica P2: calculadora con condicionales y operador ternario</h1>
    </div>
  </header>
  <main class="container">
<section class="panel calculator">
  <p class="eyebrow">Práctica P2</p>
  <h2>Calculadora con condicionales</h2>
  <form id="calculator-form">
    <div class="field"><label for="number-one">Primer número</label><input id="number-one" type="number" step="any" value="18" required></div>
    <div class="field">
      <label for="operation">Operación</label>
      <select id="operation">
        <option value="add">Sumar</option>
        <option value="subtract">Restar</option>
        <option value="multiply">Multiplicar</option>
        <option value="divide">Dividir</option>
      </select>
    </div>
    <div class="field"><label for="number-two">Segundo número</label><input id="number-two" type="number" step="any" value="6" required></div>
    <button type="submit">Calcular</button>
  </form>
  <div id="calculator-result" class="calculator-result" aria-live="polite">
    <span id="expression">18 + 6</span>
    <strong id="answer">24</strong>
    <p id="classification">El resultado es positivo.</p>
  </div>
</section>
  </main>
  <footer class="site-footer">
    <div class="container">
      <p>AI Career · JavaScript Nivel I</p>
    </div>
  </footer>
  <script src="script.js"></script>
</body>
</html>
