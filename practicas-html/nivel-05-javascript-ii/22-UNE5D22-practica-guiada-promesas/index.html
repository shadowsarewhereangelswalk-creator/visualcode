<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Ejercicio guiado de promesas con then y catch">
  <title>UNE5D22 | Ejercicio guiado de promesas con then y catch</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <div class="container">
      <p class="class-code">Nivel 5 · Clase 22 · UNE5D22</p>
      <h1>Ejercicio guiado de promesas con then y catch</h1>
    </div>
  </header>
  <main class="container">
<section class="panel">
  <p class="eyebrow">Práctica guiada</p>
  <h2>Procesamiento de pedido con promesas</h2>
  <form id="order-form">
    <div class="field"><label for="order-product">Producto</label><input id="order-product" value="Curso JavaScript II" required></div>
    <div class="field"><label for="order-amount">Monto</label><input id="order-amount" type="number" min="1" value="85" required></div>
    <label class="check-row"><input id="payment-approved" type="checkbox" checked> Pago aprobado</label>
    <button type="submit">Procesar pedido</button>
  </form>
  <ol id="order-steps" class="order-steps">
    <li data-step="validate">Validar datos</li>
    <li data-step="payment">Procesar pago</li>
    <li data-step="prepare">Preparar entrega</li>
  </ol>
  <p id="order-result" class="output" aria-live="polite">Pedido listo para iniciar.</p>
</section>
  </main>
  <footer class="site-footer">
    <div class="container">
      <p>AI Career · JavaScript Nivel II</p>
    </div>
  </footer>
  <script src="script.js"></script>
</body>
</html>
