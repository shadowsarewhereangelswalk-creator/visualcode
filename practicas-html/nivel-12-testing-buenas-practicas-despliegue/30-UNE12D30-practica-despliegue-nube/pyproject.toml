[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"app.py" = ["E402"]

[tool.coverage.run]
branch = true
source = ["deployment_app"]

[tool.coverage.report]
fail_under = 100
show_missing = true
