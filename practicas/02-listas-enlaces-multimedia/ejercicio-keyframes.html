<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Ejercicio simple de Keyframes 2</title>

  <style>
    .caja {
      width: 200px;
      height: 300px;
      background: blue;

      animation: moverHorizontal 2s infinite alternate;
    }

    @keyframes moverHorizontal {
      from {
        transform: translateX(0);
      }

      to {
        transform: translateX(800px);
      }
    }

    .caja2 {
      width: 200px;
      height: 300px;
      background: rgb(158, 222, 8);

      animation: moverVertical 4s infinite alternate;
    }

    @keyframes moverVertical {
      from {
        transform: translateY(0);
      }

      to {
        transform: translateY(800px);
      }
    }
  </style>
</head>

<body>

  <div class="caja"></div>
  <div class="caja2"></div>

</body>
</html>
