<!doctype html>
<html lang="{{ idioma }}">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ textos.titulo }}</title>
    <style>
        :root { font-family: Inter, system-ui, sans-serif; color: {{ estilos.texto }}; background: {{ estilos.fondo }}; }
        main { width: min(680px, calc(100% - 40px)); margin: 60px auto; padding: 36px; box-sizing: border-box; border: 1px solid {{ estilos.acento }}; border-radius: 22px; }
        h1 { color: {{ estilos.acento }}; }
        form { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 24px; }
        select, button { padding: 11px 14px; border-radius: 9px; font: inherit; }
        select { border: 1px solid {{ estilos.acento }}; }
        button { border: 0; color: {{ estilos.fondo }}; background: {{ estilos.acento }}; font-weight: 800; cursor: pointer; }
        .secundario { color: {{ estilos.texto }}; background: transparent; border: 1px solid {{ estilos.acento }}; }
    </style>
</head>
<body>
<main>
    <h1>{{ textos.titulo }}</h1>
    <p>{{ textos.mensaje }}</p>
    <form action="{{ url_for('preferencias') }}" method="post">
        <select name="tema" aria-label="Tema">
            {% for opcion in temas %}<option value="{{ opcion }}" {% if opcion == tema %}selected{% endif %}>{{ opcion|capitalize }}</option>{% endfor %}
        </select>
        <select name="idioma" aria-label="Idioma">
            {% for codigo, nombre in idiomas.items() %}<option value="{{ codigo }}" {% if codigo == idioma %}selected{% endif %}>{{ nombre }}</option>{% endfor %}
        </select>
        <button type="submit">{{ textos.guardar }}</button>
    </form>
    <form action="{{ url_for('restablecer') }}" method="post"><button class="secundario" type="submit">Restablecer</button></form>
</main>
</body>
</html>
