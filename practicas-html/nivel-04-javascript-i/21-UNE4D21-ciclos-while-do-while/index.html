<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Fundamentos de ciclos while y do-while">
  <title>UNE4D21 | Fundamentos de ciclos while y do-while</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <div class="container">
      <p class="class-code">Nivel 4 · Clase 21 · UNE4D21</p>
      <h1>Fundamentos de ciclos while y do-while</h1>
    </div>
  </header>
  <main class="container">
<section class="panel">
  <p class="eyebrow">Fundamentos</p>
  <h2>Ciclos while y do-while</h2>
  <p>Compara un ciclo que evalúa antes de ejecutar con otro que siempre se ejecuta al menos una vez.</p>
  <form id="loop-form" class="inline-form">
    <div class="field"><label for="loop-limit">Cantidad de repeticiones</label><input id="loop-limit" type="number" min="0" max="20" value="5" required></div>
    <button type="submit">Comparar ciclos</button>
  </form>
  <div class="comparison">
    <article class="output"><h3>while</h3><div id="while-result" class="loop-results"></div><p id="while-count"></p></article>
    <article class="output"><h3>do-while</h3><div id="do-result" class="loop-results"></div><p id="do-count"></p></article>
  </div>
</section>
  </main>
  <footer class="site-footer">
    <div class="container">
      <p>AI Career · JavaScript Nivel I</p>
    </div>
  </footer>
  <script src="script.js"></script>
</body>
</html>
