<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Fundamentos de creación y manipulación de objetos">
  <title>UNE5D09 | Fundamentos de creación y manipulación de objetos</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <div class="container">
      <p class="class-code">Nivel 5 · Clase 9 · UNE5D09</p>
      <h1>Fundamentos de creación y manipulación de objetos</h1>
    </div>
  </header>
  <main class="container">
<section class="panel">
  <p class="eyebrow">Fundamentos</p>
  <h2>Creación y manipulación de objetos</h2>
  <div class="object-layout">
    <form id="object-form">
      <div class="field"><label for="profile-name">Nombre</label><input id="profile-name" value="Karen" required></div>
      <div class="field"><label for="profile-role">Rol</label><input id="profile-role" value="Desarrolladora web" required></div>
      <div class="field"><label for="profile-level">Nivel</label><input id="profile-level" type="number" min="1" value="5" required></div>
      <label class="check-row"><input id="profile-active" type="checkbox" checked> Perfil activo</label>
      <button type="submit">Actualizar objeto</button>
    </form>
    <article class="object-card">
      <p class="eyebrow">Objeto JavaScript</p>
      <h3 id="object-title"></h3>
      <pre id="object-json"></pre>
    </article>
  </div>
  <div id="property-list" class="property-list"></div>
</section>
  </main>
  <footer class="site-footer">
    <div class="container">
      <p>AI Career · JavaScript Nivel II</p>
    </div>
  </footer>
  <script src="script.js"></script>
</body>
</html>
