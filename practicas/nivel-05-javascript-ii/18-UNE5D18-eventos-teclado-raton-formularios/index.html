<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Fundamentos de eventos de teclado, ratón y formularios">
  <title>UNE5D18 | Fundamentos de eventos de teclado, ratón y formularios</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <div class="container">
      <p class="class-code">Nivel 5 · Clase 18 · UNE5D18</p>
      <h1>Fundamentos de eventos de teclado, ratón y formularios</h1>
    </div>
  </header>
  <main class="container">
<section class="panel">
  <p class="eyebrow">Fundamentos</p>
  <h2>Eventos de teclado, ratón y formularios</h2>
  <div class="event-lab">
    <div>
      <button id="click-target" type="button">Haz clic</button>
      <div id="hover-target" class="hover-target" tabindex="0">Entra con el puntero</div>
      <div class="field"><label for="typing-target">Escribe algo</label><input id="typing-target" placeholder="Evento input"></div>
    </div>
    <form id="sample-form">
      <div class="field"><label for="event-email">Correo</label><input id="event-email" type="email" required></div>
      <button type="submit">Enviar formulario</button>
    </form>
  </div>
  <article class="event-inspector">
    <p class="eyebrow">Último evento</p>
    <dl>
      <div><dt>Tipo</dt><dd id="event-type">—</dd></div>
      <div><dt>Objetivo</dt><dd id="event-target">—</dd></div>
      <div><dt>Dato</dt><dd id="event-data">—</dd></div>
      <div><dt>Total</dt><dd id="event-count">0</dd></div>
    </dl>
  </article>
</section>
  </main>
  <footer class="site-footer">
    <div class="container">
      <p>AI Career · JavaScript Nivel II</p>
    </div>
  </footer>
  <script src="script.js"></script>
</body>
</html>
