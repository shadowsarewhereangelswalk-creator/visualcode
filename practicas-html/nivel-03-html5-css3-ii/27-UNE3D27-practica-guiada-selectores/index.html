<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Ejercicio guiado de selectores avanzados y especificidad">
  <title>UNE3D27 | Ejercicio guiado de selectores avanzados y especificidad</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <div class="container">
      <p class="class-code">Nivel 3 · Clase 27 · UNE3D27</p>
      <h1>Ejercicio guiado de selectores avanzados y especificidad</h1>
    </div>
  </header>
  <main class="container">
<section>
  <p class="eyebrow">Práctica guiada</p>
  <h2>Formulario estilizado con selectores avanzados</h2>
  <form class="signup">
    <div class="field">
      <label for="name">Nombre completo</label>
      <input id="name" name="name" type="text" placeholder="Ana Pérez" required>
    </div>
    <div class="field">
      <label for="email">Correo electrónico</label>
      <input id="email" name="email" type="email" placeholder="ana@example.com" required>
    </div>
    <fieldset>
      <legend>Área de interés</legend>
      <label><input type="radio" name="area" value="frontend" checked> Frontend</label>
      <label><input type="radio" name="area" value="ux"> Experiencia de usuario</label>
      <label><input type="radio" name="area" value="data"> Datos</label>
    </fieldset>
    <label class="terms"><input type="checkbox" required> Acepto las condiciones del programa</label>
    <button type="submit">Crear registro</button>
  </form>
</section>
  </main>
  <footer class="site-footer">
    <div class="container">
      <p>AI Career · HTML5 y CSS3 Nivel II</p>
    </div>
  </footer>
</body>
</html>
