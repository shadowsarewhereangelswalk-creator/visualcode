<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Ejercicio guiado de funciones flecha">
  <title>UNE5D03 | Ejercicio guiado de funciones flecha</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <div class="container">
      <p class="class-code">Nivel 5 · Clase 3 · UNE5D03</p>
      <h1>Ejercicio guiado de funciones flecha</h1>
    </div>
  </header>
  <main class="container">
<section class="panel">
  <p class="eyebrow">Práctica guiada</p>
  <h2>Calculadora de precio final</h2>
  <form id="price-form">
    <div class="field"><label for="base-price">Precio base</label><input id="base-price" type="number" min="0" step="0.01" value="120" required></div>
    <div class="field"><label for="discount">Descuento</label><input id="discount" type="number" min="0" max="80" value="15" required></div>
    <div class="field"><label for="tax">Impuesto</label><input id="tax" type="number" min="0" max="50" value="8" required></div>
    <button type="submit">Calcular</button>
  </form>
  <article class="receipt">
    <h3>Resumen</h3>
    <dl>
      <div><dt>Precio base</dt><dd id="base-output"></dd></div>
      <div><dt>Descuento</dt><dd id="discount-output"></dd></div>
      <div><dt>Impuesto</dt><dd id="tax-output"></dd></div>
      <div class="total"><dt>Precio final</dt><dd id="final-output"></dd></div>
    </dl>
    <code id="formula-output"></code>
  </article>
</section>
  </main>
  <footer class="site-footer">
    <div class="container">
      <p>AI Career · JavaScript Nivel II</p>
    </div>
  </footer>
  <script src="script.js"></script>
</body>
</html>
