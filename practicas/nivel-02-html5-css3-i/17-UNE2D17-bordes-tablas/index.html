<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>UNE2D17 — Bordes en tablas</title>
  <style>
    table {
      border-collapse: collapse;
      width: 100%;
      max-width: 640px;
    }

    th,
    td {
      border: 1px solid #333;
      padding: 10px;
      text-align: left;
    }

    th {
      background: #eeeeee;
    }
  </style>
</head>
<body>
  <h1>Tabla con presentación inicial</h1>

  <table>
    <thead>
      <tr>
        <th>Producto</th>
        <th>Cantidad</th>
        <th>Estado</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>Monitor</td>
        <td>2</td>
        <td>Disponible</td>
      </tr>
      <tr>
        <td>Teclado</td>
        <td>5</td>
        <td>Disponible</td>
      </tr>
    </tbody>
  </table>
</body>
</html>
