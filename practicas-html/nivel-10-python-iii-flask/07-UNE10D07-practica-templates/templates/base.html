{% macro indicador(etiqueta, valor) %}
<article class="indicador">
    <strong>{{ valor }}</strong>
    <span>{{ etiqueta }}</span>
</article>
{% endmacro %}
<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block titulo %}Panel de proyectos{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='estilos.css') }}">
</head>
<body>
    <main>{% block contenido %}{% endblock %}</main>
</body>
</html>
