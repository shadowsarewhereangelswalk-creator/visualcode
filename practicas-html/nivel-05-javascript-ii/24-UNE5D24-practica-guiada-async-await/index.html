<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Ejercicio guiado de async y await">
  <title>UNE5D24 | Ejercicio guiado de async y await</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <div class="container">
      <p class="class-code">Nivel 5 · Clase 24 · UNE5D24</p>
      <h1>Ejercicio guiado de async y await</h1>
    </div>
  </header>
  <main class="container">
<section class="panel">
  <p class="eyebrow">Práctica guiada</p>
  <h2>Lector de publicaciones con async/await</h2>
  <form id="post-form" class="inline-form">
    <div class="field"><label for="post-id">ID de publicación</label><input id="post-id" type="number" min="1" max="100" value="1" required></div>
    <button type="submit">Consultar publicación</button>
    <button id="random-post" class="secondary" type="button">ID aleatorio</button>
  </form>
  <article id="post-card" class="post-card">
    <span id="post-number">Publicación 1</span>
    <h3 id="post-title">Esperando consulta</h3>
    <p id="post-body">Usa el formulario para obtener datos externos.</p>
  </article>
  <p id="post-status" class="output" role="status">Listo.</p>
</section>
  </main>
  <footer class="site-footer">
    <div class="container">
      <p>AI Career · JavaScript Nivel II</p>
    </div>
  </footer>
  <script src="script.js"></script>
</body>
</html>
