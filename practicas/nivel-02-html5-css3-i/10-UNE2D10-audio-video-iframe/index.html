<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>UNE2D10 — Multimedia en HTML5</title>
</head>
<body>
  <header>
    <h1>Audio, video e iframe en HTML5</h1>
  </header>

  <main>
    <section>
      <h2>Audio</h2>
      <audio controls>
        <source src="https://interactive-examples.mdn.mozilla.net/media/cc0-audio/t-rex-roar.mp3" type="audio/mpeg">
        Tu navegador no puede reproducir este audio.
      </audio>
    </section>

    <section>
      <h2>Video</h2>
      <video controls width="480">
        <source src="https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4" type="video/mp4">
        Tu navegador no puede reproducir este video.
      </video>
    </section>

    <section>
      <h2>Iframe</h2>
      <iframe
        title="Ejemplo de iframe"
        width="480"
        height="160"
        srcdoc="<h3>Contenido dentro del iframe</h3><p>Este documento está incrustado dentro de la página principal.</p>">
      </iframe>
    </section>
  </main>
</body>
</html>
