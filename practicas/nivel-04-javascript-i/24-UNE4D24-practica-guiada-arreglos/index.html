<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Ejercicio guiado de arreglos: declaración, índices y recorrido">
  <title>UNE4D24 | Ejercicio guiado de arreglos: declaración, índices y recorrido</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <div class="container">
      <p class="class-code">Nivel 4 · Clase 24 · UNE4D24</p>
      <h1>Ejercicio guiado de arreglos: declaración, índices y recorrido</h1>
    </div>
  </header>
  <main class="container">
<section class="panel">
  <p class="eyebrow">Práctica guiada</p>
  <h2>Registro de calificaciones con arreglos</h2>
  <form id="score-form" class="inline-form">
    <div class="field"><label for="student">Estudiante</label><input id="student" placeholder="Nombre" required></div>
    <div class="field"><label for="student-score">Calificación</label><input id="student-score" type="number" min="0" max="100" value="80" required></div>
    <button type="submit">Agregar resultado</button>
  </form>
  <div class="stats-row">
    <article><span>Estudiantes</span><strong id="student-count"></strong></article>
    <article><span>Promedio</span><strong id="average-score"></strong></article>
    <article><span>Mejor nota</span><strong id="highest-score"></strong></article>
  </div>
  <div id="score-list" class="score-list"></div>
</section>
  </main>
  <footer class="site-footer">
    <div class="container">
      <p>AI Career · JavaScript Nivel I</p>
    </div>
  </footer>
  <script src="script.js"></script>
</body>
</html>
