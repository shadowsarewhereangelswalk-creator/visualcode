[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "career-service-kit-demo"
version = "0.2.0"
description = "Utilidades de respuestas y paginación para servicios Python"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "AI Career Student" }]
keywords = ["api", "flask", "pagination"]

[project.optional-dependencies]
web = ["Flask>=3.1,<4"]
test = ["pytest>=8,<9"]

[project.scripts]
career-service-info = "career_service_kit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
