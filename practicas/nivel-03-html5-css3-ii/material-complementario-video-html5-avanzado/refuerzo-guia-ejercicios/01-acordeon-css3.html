<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Refuerzo 01 — CSS3 y acordeón</title>
  <link rel="stylesheet" href="refuerzo.css">
</head>
<body>
  <main class="contenedor">
    <section class="tarjeta-destacada">
      <h1>Refuerzo CSS3</h1>
      <p>Tarjeta con borde redondeado, sombra, degradado y transformación.</p>
    </section>

    <section class="acordeon" aria-label="Acordeón de repaso">
      <details>
        <summary>HTML5</summary>
        <p>HTML define la estructura y el contenido del documento.</p>
      </details>
      <details>
        <summary>CSS3</summary>
        <p>CSS describe la presentación y permite adaptar la interfaz.</p>
      </details>
      <details>
        <summary>JavaScript</summary>
        <p>JavaScript añade comportamiento e interacción.</p>
      </details>
    </section>
  </main>
</body>
</html>
