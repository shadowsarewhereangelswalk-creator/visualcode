<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Fundamentos de funciones flecha">
  <title>UNE5D02 | Fundamentos de funciones flecha</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <div class="container">
      <p class="class-code">Nivel 5 · Clase 2 · UNE5D02</p>
      <h1>Fundamentos de funciones flecha</h1>
    </div>
  </header>
  <main class="container">
<section class="panel">
  <p class="eyebrow">Fundamentos</p>
  <h2>Funciones flecha</h2>
  <p>Introduce números separados por comas y aplica funciones flecha con retorno explícito e implícito.</p>
  <form id="arrow-form">
    <div class="field"><label for="numbers">Números</label><input id="numbers" value="2, 4, 6, 8" required></div>
    <div class="controls">
      <button type="button" data-operation="double">Duplicar</button>
      <button type="button" data-operation="square">Elevar al cuadrado</button>
      <button type="button" data-operation="positive">Conservar positivos</button>
      <button type="submit">Calcular suma</button>
    </div>
  </form>
  <div class="output-grid">
    <article class="output"><h3>Entrada</h3><code id="input-array"></code></article>
    <article class="output"><h3>Resultado</h3><code id="output-array"></code><strong id="sum-result"></strong></article>
  </div>
</section>
  </main>
  <footer class="site-footer">
    <div class="container">
      <p>AI Career · JavaScript Nivel II</p>
    </div>
  </footer>
  <script src="script.js"></script>
</body>
</html>
