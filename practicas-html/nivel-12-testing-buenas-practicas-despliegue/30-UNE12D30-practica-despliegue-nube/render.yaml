services:
  - type: web
    name: une12-deployment-control
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: APP_NAME
        value: Deployment Control
      - key: APP_ENV
        value: production
      - key: APP_VERSION
        value: 1.0.0
      - key: RELEASE_SHA
        value: render
      - key: SECRET_KEY
        generateValue: true

