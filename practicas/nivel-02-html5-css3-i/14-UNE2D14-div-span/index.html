<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>UNE2D14 — div y span</title>
  <style>
    .destacado {
      background: #fff3a6;
      font-weight: bold;
    }

    .caja {
      border: 1px solid #555;
      padding: 8px;
    }
  </style>
</head>
<body>
  <h1>Comparación de div, p y span</h1>

  <h2>Dos div</h2>
  <div class="caja">Primer div</div>
  <div class="caja">Segundo div</div>

  <h2>Dos párrafos</h2>
  <p class="caja">Primer párrafo</p>
  <p class="caja">Segundo párrafo</p>

  <h2>Span dentro de un texto</h2>
  <p>Este texto contiene una <span class="destacado">parte destacada</span> sin crear un bloque nuevo.</p>
</body>
</html>
