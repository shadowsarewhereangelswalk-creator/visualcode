{% extends "base.html" %}
{% block titulo %}{{ curso.nombre }} · Academia Flask{% endblock %}
{% block contenido %}
<article class="detalle">
    <span>{{ curso.nivel }}</span>
    <h1>{{ curso.nombre }}</h1>

    <a href="{{ url_for('inicio') }}">Volver al catálogo</a>
</article>
{% endblock %}
