<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Ejercicio guiado de creación y manipulación de objetos">
  <title>UNE5D10 | Ejercicio guiado de creación y manipulación de objetos</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <div class="container">
      <p class="class-code">Nivel 5 · Clase 10 · UNE5D10</p>
      <h1>Ejercicio guiado de creación y manipulación de objetos</h1>
    </div>
  </header>
  <main class="container">
<section class="panel">
  <p class="eyebrow">Práctica guiada</p>
  <h2>Control de inventario con objetos</h2>
  <div class="inventory-layout">
    <article class="product-preview">
      <span id="product-code"></span>
      <h3 id="product-name"></h3>
      <p id="product-category"></p>
      <strong id="product-stock"></strong>
      <small id="product-status"></small>
    </article>
    <form id="inventory-form">
      <div class="field">
        <label for="movement">Movimiento</label>
        <select id="movement"><option value="add">Agregar unidades</option><option value="sell">Vender unidades</option><option value="rename">Cambiar nombre</option></select>
      </div>
      <div class="field"><label for="movement-value">Cantidad o nombre</label><input id="movement-value" value="5" required></div>
      <button type="submit">Aplicar cambio</button>
    </form>
  </div>
  <div class="output"><h3>Propiedades actuales</h3><code id="inventory-json"></code><p id="inventory-message" aria-live="polite"></p></div>
</section>
  </main>
  <footer class="site-footer">
    <div class="container">
      <p>AI Career · JavaScript Nivel II</p>
    </div>
  </footer>
  <script src="script.js"></script>
</body>
</html>
