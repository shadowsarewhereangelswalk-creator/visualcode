<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ejemplo 06-04 — Recuperar sessionStorage</title>
  <link rel="stylesheet" href="estilos.css">
</head>
<body>
  <main>
    <h1>Ejemplo 06-04 — Recuperación de sessionStorage</h1>
    <section class="panel">
      <div id="contenido" aria-live="polite"></div>
      <p>Este archivo no asigna valores: solo intenta leer los que existan en la sesión de esta pestaña.</p>
    </section>
  </main>

  <script>
    const nombreCurso = sessionStorage.getItem("nombreCurso");
    const nivelCurso = sessionStorage.getItem("nivelCurso");
    const contenido = document.getElementById("contenido");

    console.error("nombreCurso:", nombreCurso);
    console.error("nivelCurso:", nivelCurso);

    contenido.textContent =
      "Contenido de las variables de sesión:\n" +
      "nombreCurso: " + nombreCurso + "\n" +
      "nivelCurso: " + nivelCurso;
  </script>
</body>
</html>
