<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Multimedia HTML5 con controles JavaScript</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site"><div class="container"><h1>Audio y video con controles personalizados</h1></div></header>
  <main class="container">
    <section class="card">
      <h2>Audio</h2>
      <audio id="audio" preload="metadata">
        <source src="https://interactive-examples.mdn.mozilla.net/media/cc0-audio/t-rex-roar.mp3" type="audio/mpeg">
        Tu navegador no puede reproducir audio.
      </audio>
      <div class="controls" data-for="audio">
        <button type="button" data-action="toggle">Reproducir / Pausar</button>
        <button type="button" class="secondary" data-action="mute">Silenciar</button>
        <label>Volumen <input data-action="volume" type="range" min="0" max="1" step="0.05" value="1"></label>
      </div>
    </section>

    <section class="card">
      <h2>Video</h2>
      <video id="video" class="media" preload="metadata" playsinline>
        <source src="https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4" type="video/mp4">
        Tu navegador no puede reproducir video.
      </video>
      <div class="controls" data-for="video">
        <button type="button" data-action="toggle">Reproducir / Pausar</button>
        <button type="button" class="secondary" data-action="mute">Silenciar</button>
        <label>Volumen <input data-action="volume" type="range" min="0" max="1" step="0.05" value="1"></label>
      </div>
    </section>
  </main>
  <footer class="site"><div class="container">HTML5 multimedia + JavaScript</div></footer>
  <script src="multimedia.js"></script>
</body>
</html>
