<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Fundamentos de método map()">
  <title>UNE5D11 | Fundamentos de método map()</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <div class="container">
      <p class="class-code">Nivel 5 · Clase 11 · UNE5D11</p>
      <h1>Fundamentos de método map()</h1>
    </div>
  </header>
  <main class="container">
<section class="panel">
  <p class="eyebrow">Fundamentos</p>
  <h2>Método map()</h2>
  <p><code>map()</code> crea un arreglo nuevo transformando cada elemento sin modificar el original.</p>
  <form id="map-form">
    <div class="field"><label for="map-values">Números separados por comas</label><input id="map-values" value="1, 2, 3, 4, 5" required></div>
    <div class="field">
      <label for="map-operation">Transformación</label>
      <select id="map-operation"><option value="double">Duplicar</option><option value="square">Cuadrado</option><option value="currency">Formato monetario</option></select>
    </div>
    <button type="submit">Aplicar map()</button>
  </form>
  <div class="map-comparison">
    <article><p class="eyebrow">Original</p><div id="original-values" class="value-row"></div></article>
    <article><p class="eyebrow">Nuevo arreglo</p><div id="mapped-values" class="value-row mapped"></div></article>
  </div>
</section>
  </main>
  <footer class="site-footer">
    <div class="container">
      <p>AI Career · JavaScript Nivel II</p>
    </div>
  </footer>
  <script src="script.js"></script>
</body>
</html>
