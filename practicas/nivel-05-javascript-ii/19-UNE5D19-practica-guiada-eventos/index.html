<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Ejercicio guiado de eventos de teclado, ratón y formularios">
  <title>UNE5D19 | Ejercicio guiado de eventos de teclado, ratón y formularios</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <div class="container">
      <p class="class-code">Nivel 5 · Clase 19 · UNE5D19</p>
      <h1>Ejercicio guiado de eventos de teclado, ratón y formularios</h1>
    </div>
  </header>
  <main class="container">
<section class="panel">
  <p class="eyebrow">Práctica guiada</p>
  <h2>Editor de color controlado por eventos</h2>
  <div class="color-editor">
    <div id="color-preview" class="color-preview" tabindex="0">
      <strong id="color-code">#2563EB</strong>
      <span>Usa ← y → para cambiar el tono</span>
    </div>
    <form id="color-form">
      <div class="field"><label for="color-picker">Selector de color</label><input id="color-picker" type="color" value="#2563eb"></div>
      <div class="field"><label for="color-name">Nombre del color</label><input id="color-name" value="Azul principal" required></div>
      <button type="submit">Guardar muestra</button>
    </form>
  </div>
  <div id="saved-colors" class="saved-colors"></div>
  <p id="color-event" class="output" aria-live="polite">Esperando una interacción.</p>
</section>
  </main>
  <footer class="site-footer">
    <div class="container">
      <p>AI Career · JavaScript Nivel II</p>
    </div>
  </footer>
  <script src="script.js"></script>
</body>
</html>
