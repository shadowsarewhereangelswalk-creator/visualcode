openapi: 3.1.0
info:
  title: Agenda de eventos
  version: 1.0.0
paths:
  /api/eventos:
    get:
      operationId: listarEventos
      parameters:
        - name: pagina
          in: query
          schema:
            type: integer
            minimum: 1
        - name: por_pagina
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 20
      responses:
        "200":
          description: Colección paginada de eventos
  /api/eventos/{evento_id}:
    get:
      operationId: obtenerEvento
      parameters:
        - name: evento_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Evento encontrado
        "404":
          description: Evento no encontrado
  /api/eventos/{evento_id}/inscripciones:
    post:
      operationId: crearInscripcion
      parameters:
        - name: evento_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nombre, correo]
              properties:
                nombre:
                  type: string
                correo:
                  type: string
                  format: email
      responses:
        "201":
          description: Inscripción creada
        "415":
          description: Tipo de contenido no admitido
        "422":
          description: Datos inválidos
