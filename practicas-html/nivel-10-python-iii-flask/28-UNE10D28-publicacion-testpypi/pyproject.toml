[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "ai-career-slug-demo"
version = "0.1.0"
description = "Conversión de texto a slugs reutilizables"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "AI Career Student" }]
keywords = ["slug", "text", "career"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.urls]
Repository = "https://github.com/shadowsarewhereangelswalk-creator/visualcode"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_career_slug"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
