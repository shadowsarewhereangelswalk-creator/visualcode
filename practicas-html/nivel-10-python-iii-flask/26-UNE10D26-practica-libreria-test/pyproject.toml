[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "career-flask-tools-demo"
version = "0.1.0"
description = "Herramientas reutilizables para servicios Flask"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "AI Career Student" }]
dependencies = ["Flask>=3.1,<4"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Framework :: Flask",
    "License :: OSI Approved :: MIT License",
]

[project.urls]
Repository = "https://github.com/shadowsarewhereangelswalk-creator/visualcode"

[tool.hatch.build.targets.wheel]
packages = ["src/career_flask_tools"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
