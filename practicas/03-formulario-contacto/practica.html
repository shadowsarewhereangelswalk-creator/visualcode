<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Formularios</h1>
    <form action="" method="get">
        <table>
            <tbody>
                <tr>
                    <td>nombre</td>
                    <td><input type="text" name="nombre" id="nombre"></td>
                </tr>
                <tr>
                    <td>edad</td>
                    <td><input type="number" name="edad" id="edad" min="0" max="120"></td>
                </tr>
                <tr>
                    <td>Sexo</td>
                    <td><input type="radio" name="sexo" id="sexo" value="F" checked>FEMENINO</td>
                    <td><input type="radio" name="sexo" id="sexo" value="M">MASCULINO</td>
                </tr>
                    <td>ACTIVIDAD:</td>
                    <td>
                        <input type="checkbox" name="actividad" id="actividad" value="ESTUDIA" multiple>ESTUDIA
                        <input type="checkbox" name="actividad" id="actividad" value="TRABAJA" multiple>TRABAJA
                        <input type="checkbox" name="actividad" id="actividad" value="OTRA" multiple>OTRA
                    </td>
                    <tr>
                        <td>NIVEL DE INSTRUCCIÓN:</td>
                        <td>
                            <select name="instruccion" id="instruccion">
                                <option value="PRIMARIA">PRIMARIA</option>
                                <option value="SECUNDARIA">SECUNDARIA</option>
                                <option value="SUPERIOR">SUPERIOR</option>
                            </select>
                        </td>
                    </tr>
                    <tr>
                        <td>FECHA DE NACIMIENTO:</td>
                        <td><input type="date" name="fecha_nacimiento" id="fecha_nacimiento"></td>
                    </tr>
                <tr>
                    <td><input type="submit" value="GUARDAR"></td>
                </tr>
            </tbody>
        </table>
        

        
    </form>
</body>
</html>
