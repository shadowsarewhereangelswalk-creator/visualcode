<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Imágenes en HTML5</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="contenedor">
    <h1>Imágenes con rutas en HTML5</h1>

    <figure>
      <img
        src="imagenes/ia-ejemplo.svg"
        alt="Ilustración de una ventana de código con las letras AI"
        width="800"
        height="450"
      >
      <figcaption>
        Esta imagen usa una ruta relativa porque está dentro de la carpeta del proyecto.
      </figcaption>
    </figure>

    <section>
      <h2>Ruta absoluta</h2>
      <p>
        Una ruta absoluta incluye la dirección completa, por ejemplo:
        https://example.com/imagenes/foto.jpg
      </p>
    </section>
  </main>
</body>
</html>
