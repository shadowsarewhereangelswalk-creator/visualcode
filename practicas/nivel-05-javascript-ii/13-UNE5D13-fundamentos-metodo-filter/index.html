<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Fundamentos de método filter()">
  <title>UNE5D13 | Fundamentos de método filter()</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <div class="container">
      <p class="class-code">Nivel 5 · Clase 13 · UNE5D13</p>
      <h1>Fundamentos de método filter()</h1>
    </div>
  </header>
  <main class="container">
<section class="panel">
  <p class="eyebrow">Fundamentos</p>
  <h2>Método filter()</h2>
  <form id="filter-form">
    <div class="field"><label for="filter-values">Números</label><input id="filter-values" value="3, 8, 12, 17, 21, 26, 30" required></div>
    <div class="field">
      <label for="filter-rule">Criterio</label>
      <select id="filter-rule"><option value="even">Solo pares</option><option value="odd">Solo impares</option><option value="greater">Mayores que el límite</option><option value="lower">Menores que el límite</option></select>
    </div>
    <div class="field"><label for="filter-limit">Límite</label><input id="filter-limit" type="number" value="15"></div>
    <button type="submit">Aplicar filter()</button>
  </form>
  <div class="filter-results">
    <div><p class="eyebrow">Arreglo original</p><div id="all-numbers" class="number-cloud"></div></div>
    <div><p class="eyebrow">Elementos filtrados</p><div id="filtered-numbers" class="number-cloud selected"></div></div>
  </div>
  <p id="filter-count" class="output"></p>
</section>
  </main>
  <footer class="site-footer">
    <div class="container">
      <p>AI Career · JavaScript Nivel II</p>
    </div>
  </footer>
  <script src="script.js"></script>
</body>
</html>
