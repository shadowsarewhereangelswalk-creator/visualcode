<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Ejercicio guiado de operadores aritméticos, relacionales y lógicos">
  <title>UNE4D10 | Ejercicio guiado de operadores aritméticos, relacionales y lógicos</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <div class="container">
      <p class="class-code">Nivel 4 · Clase 10 · UNE4D10</p>
      <h1>Ejercicio guiado de operadores aritméticos, relacionales y lógicos</h1>
    </div>
  </header>
  <main class="container">
<section class="panel">
  <p class="eyebrow">Práctica guiada</p>
  <h2>Verificador de acceso al proyecto</h2>
  <p>El acceso requiere edad mínima, suficientes clases completadas y aceptación de las normas.</p>
  <form id="access-form">
    <div class="field"><label for="age">Edad</label><input id="age" type="number" min="1" value="24" required></div>
    <div class="field"><label for="lessons">Clases completadas</label><input id="lessons" type="number" min="0" max="31" value="12" required></div>
    <label class="check-row"><input id="rules" type="checkbox" checked> Acepto las normas del proyecto</label>
    <button type="submit">Comprobar acceso</button>
  </form>
  <div id="access-result" class="decision" aria-live="polite">
    <strong>Evaluación pendiente</strong>
    <ul id="requirements"></ul>
  </div>
</section>
  </main>
  <footer class="site-footer">
    <div class="container">
      <p>AI Career · JavaScript Nivel I</p>
    </div>
  </footer>
  <script src="script.js"></script>
</body>
</html>
