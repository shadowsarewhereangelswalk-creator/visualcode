<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Práctica P1: validación de un formulario con ventanas emergentes">
  <title>UNE4D08 | Práctica P1: validación de un formulario con ventanas emergentes</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <div class="container">
      <p class="class-code">Nivel 4 · Clase 8 · UNE4D08</p>
      <h1>Práctica P1: validación de un formulario con ventanas emergentes</h1>
    </div>
  </header>
  <main class="container">
<section class="panel">
  <p class="eyebrow">Práctica P1</p>
  <h2>Registro con validación y ventanas emergentes</h2>
  <p>La aplicación usa <code>prompt</code>, <code>confirm</code> y <code>alert</code> para acompañar el envío del formulario.</p>
  <form id="registration-form">
    <div class="field"><label for="student-name">Nombre</label><input id="student-name" name="name" required></div>
    <div class="field"><label for="student-email">Correo</label><input id="student-email" name="email" type="email" required></div>
    <div class="field">
      <label for="course">Curso</label>
      <select id="course" name="course" required>
        <option value="">Selecciona una opción</option>
        <option>JavaScript Nivel I</option>
        <option>HTML5 y CSS3</option>
        <option>Introducción a Python</option>
      </select>
    </div>
    <div class="controls">
      <button id="personalize" class="secondary" type="button">Completar nombre con prompt</button>
      <button type="submit">Enviar registro</button>
    </div>
  </form>
  <article id="receipt" class="output" hidden aria-live="polite">
    <h3>Registro confirmado</h3>
    <p id="receipt-text"></p>
  </article>
</section>
  </main>
  <footer class="site-footer">
    <div class="container">
      <p>AI Career · JavaScript Nivel I</p>
    </div>
  </footer>
  <script src="script.js"></script>
</body>
</html>
