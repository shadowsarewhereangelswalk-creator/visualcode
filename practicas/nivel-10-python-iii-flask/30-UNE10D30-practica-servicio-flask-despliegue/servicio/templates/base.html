<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block titulo %}Nexo Digital{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='estilos.css') }}">
</head>
<body>
    <nav><a href="{{ url_for('principal.inicio') }}">Nexo Digital</a><a href="{{ url_for('principal.solicitudes') }}">Solicitudes</a><a href="{{ url_for('principal.salud') }}">Salud</a></nav>
    <main>
        {% for categoria, mensaje in get_flashed_messages(with_categories=true) %}<p class="aviso {{ categoria }}">{{ mensaje }}</p>{% endfor %}
        {% block contenido %}{% endblock %}
    </main>
</body>
</html>
